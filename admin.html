<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CyberSafe Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Orbitron;
background:#020617;
color:white;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:40px 40px;
}

header{
position:fixed;top:0;width:100%;padding:20px 50px;
display:flex;justify-content:space-between;
background:rgba(0,0,0,.7);
border-bottom:1px solid cyan;
}

.logo{color:cyan;font-weight:900;letter-spacing:4px}

footer{
position:fixed;bottom:0;width:100%;
padding:12px 50px;
display:flex;justify-content:space-between;
border-top:1px solid cyan;
background:rgba(0,0,0,.7);
font-size:10px;
}

.container{
padding:120px 60px 80px;
max-width:1000px;
margin:auto;
}

h1{
margin-bottom:20px;
color:cyan;
}

.stats{
margin-bottom:30px;
font-size:12px;
letter-spacing:3px;
color:#22d3ee;
}

.card{
border:1px solid cyan;
padding:20px;
margin-bottom:20px;
background:rgba(0,0,0,.7);
box-shadow:0 0 15px #22d3ee55;
}

.badge{
display:inline-block;
padding:4px 10px;
border:1px solid cyan;
font-size:10px;
margin-bottom:10px;
color:#22d3ee;
}

.empty{
opacity:.5;
text-align:center;
margin-top:50px;
}
</style>
</head>

<body>

<header>
<div class="logo">CYBERSAFE ADMIN</div>
<div>Authority Dashboard</div>
</header>

<div class="container">

<h1>🚨 Reported Crimes</h1>

<div class="stats" id="count"></div>

<div id="reports"></div>

</div>

<footer>
<div>CyberSafe AI © 2026</div>
<div>Secure Authority Network</div>
</footer>

<script>

let data = JSON.parse(localStorage.getItem("crimes") || "[]");

document.getElementById("count").innerText =
"TOTAL REPORTS : " + data.length;

let box = document.getElementById("reports");

if(data.length===0){
box.innerHTML="<div class='empty'>No crime reports found.</div>";
}

data.reverse().forEach(c=>{

box.innerHTML += `
<div class="card">
<div class="badge">${c.time}</div>
<br>
<b>Reported By:</b> ${c.user || "Anonymous"}<br><br>
<b>Crime Type:</b> ${c.type}<br><br>
<b>Description:</b><br>
${c.description || "Image Report"}
</div>
`;

});

</script>

</body>
</html>
