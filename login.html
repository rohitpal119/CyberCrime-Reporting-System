<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Orbitron;
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
border:1px solid cyan;
padding:40px;
width:350px;
text-align:center;
background:black;
}

input{
width:100%;
padding:12px;
margin-top:15px;
background:#020617;
border:1px solid cyan;
color:white;
font-family:Orbitron;
}

button{
margin-top:25px;
width:100%;
padding:12px;
background:cyan;
border:none;
font-family:Orbitron;
cursor:pointer;
font-weight:700;
}

small{opacity:.6}
</style>
</head>

<body>

<div class="box">
<h2>ADMIN ACCESS</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">LOGIN</button>

<br><br>
<small>Prototype Mode</small>
</div>

<script>

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

/* Simple hardcoded admin */

if(u==="admin" && p==="admin123"){
  window.location.href="admin.html";
}else{
  alert("Invalid Credentials");
}

}

</script>

</body>
</html>
<!-- //Username: admin
Password: admin123 -->
