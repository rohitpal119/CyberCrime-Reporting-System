===================================================== */

        /* =====================================================
================ BODY ==================================
===================================================== */

        body {

            z-index: -5;

        }

            width: 100%;
            height: 100%;

            transform: translateY(17%);

        }

        .video-overlay {

            position: absolute;

            inset: 0;

                    rgba(0, 0, 0, .55),
                    rgba(0, 0, 0, .88));

            z-index: 2;

        }

================ LIQUID GLASS ==========================
===================================================== */

        .liquid-glass {

            position: relative;

            overflow: hidden;

            background:
                rgba(255, 255, 255, .03);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, .12),
                0 8px 32px rgba(0, 0, 0, .35);

        }

        .liquid-glass::before {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            padding: 1.4px;

            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, .45) 0%,
                    rgba(255, 255, 255, .15) 20%,

                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            mask-composite: exclude;

            pointer-events: none;

        }

        const video =
            document.getElementById("bgVideo");

        let fadeAnimation = null;
        let fadingOut = false;

        function fadeVideo(target, duration) {

            if (fadeAnimation) {

                cancelAnimationFrame(fadeAnimation);

            }

            const startOpacity =
                parseFloat(video.style.opacity || 0);

            const startTime = performance.now();

            function animate(now) {

                const progress =
                    Math.min((now - startTime) / duration, 1);

                const opacity =
                    startOpacity +
                    (target - startOpacity) * progress;

                video.style.opacity = opacity;

                if (progress < 1) {

                    fadeAnimation =
                        requestAnimationFrame(animate);

                }

            }

            fadeAnimation =
                requestAnimationFrame(animate);

        }

        /* INITIAL PLAY */

        video.addEventListener("loadeddata", () => {

            video.play();

            fadeVideo(1, 500);

        });

        /* FADE OUT BEFORE LOOP */

        video.addEventListener("timeupdate", () => {

            const remaining =
                video.duration - video.currentTime;

            if (remaining <= 0.55 && !fadingOut) {

                fadingOut = true;

                fadeVideo(0, 500);

            }

        });

        /* MANUAL LOOP */

        video.addEventListener("ended", () => {

            video.style.opacity = 0;

            setTimeout(() => {

                video.currentTime = 0;

                video.play();

                fadeVideo(1, 500);

                fadingOut = false;

            }, 100);

        });

    && data.data
    && data.data.report
) {
                    

    // Get all previous FIRs
    let allFIRs = JSON.parse(
        localStorage.getItem("firReports") || "[]"
    );

    // Add current FIR
    allFIRs.push({

        id: Date.now(),

        date: new Date().toLocaleString(),

        report: data.data.report

    });

    // Save all FIRs
    localStorage.setItem(
        "firReports",
        JSON.stringify(allFIRs)
    );

}

                    /* AI MESSAGE */

                    liveTranscript.innerHTML += `
                <div style="margin-bottom:15px">
                    <b style="color:#3b82f6">AI:</b><br>
                    ${data.reply}
                </div>
            `;

                    liveTranscript.scrollTop =
                        liveTranscript.scrollHeight;

                    /* AI SPEAK */

                    await speak(data.reply);

                    /* RESTART LISTENING */

                    if (isCalling) {

                        setTimeout(() => {

                            startListening();

                        }, 1200);

                    }

                } catch (err) {

                    console.log(err);

                    if (isCalling) {

                        setTimeout(() => {

                            startListening();

                        }, 1500);

                    }

                }

            };

            recognition.onerror = function (event) {

                console.log(
                    "Speech Recognition Error:",
                    event.error
                );

                if (isCalling) {

                    setTimeout(() => {

                        startListening();

                    }, 1500);

                }

            };

            recognition.onend = function () {

                console.log("Recognition Ended");

            };

        }

        /* ================= START LISTENING ================= */

        function startListening() {

            if (!isCalling || isSpeaking) return;

            try {

                recognition.start();

            } catch (err) {

                console.log(err);

            }

        }

        /* ================= START CALL ================= */

        async function startCall() {

            if (isCalling) return;

            isCalling = true;

            callStatus.innerHTML =
                "🟢 AI Assistant Connected";

            liveTranscript.innerHTML = "";

            recognition =
                new webkitSpeechRecognition();

            recognition.lang = "en-IN";
            recognition.continuous = false;
            recognition.interimResults = false;

            setupRecognition();

            let greeting =
                "Hello, this is CyberSafe helpline. Please describe your issue.";

            liveTranscript.innerHTML += `
        <div style="margin-bottom:15px">
            <b style="color:#3b82f6">AI:</b><br>
            ${greeting}
        </div>
    `;

            liveTranscript.scrollTop =
                liveTranscript.scrollHeight;

            await speak(greeting);

            setTimeout(() => {

                startListening();

            }, 1200);

        }

        /* ================= STOP CALL ================= */

        function stopCall() {

            isCalling = false;

            speechSynthesis.cancel();

            if (recognition) {

                recognition.stop();

            }

            callStatus.innerHTML =
                "🔴 Call Ended";

        }

    </script>

</body>

</html>
