<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CyberSafe AI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Orbitron;
background:#020617;
color:white;
overflow:hidden;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:40px 40px;
}

header{
position:fixed;top:0;width:100%;padding:20px 50px;
display:flex;justify-content:space-between;align-items:center;
background:rgba(0,0,0,.6);backdrop-filter:blur(10px);
border-bottom:1px solid #22d3ee44;z-index:100;
}

.logo{color:#22d3ee;font-weight:900;letter-spacing:4px}

nav a{margin:0 20px;color:#aaa;text-decoration:none;font-size:12px;cursor:pointer}
nav a:hover{color:#22d3ee}

.cursor{
position:fixed;width:400px;height:400px;
background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%);
pointer-events:none;
}

.scanline{
position:fixed;width:100%;height:2px;background:cyan;
animation:scan 5s linear infinite;opacity:.2;
}

@keyframes scan{from{top:-100%}to{top:100%}}

.hero{
height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
}

h1{font-size:90px;font-weight:900}

.glow{
background:linear-gradient(90deg,#22d3ee,#3b82f6);
-webkit-background-clip:text;color:transparent;text-shadow:0 0 40px cyan;
}

.subtitle{color:#94a3b8;max-width:600px;margin:20px auto;font-size:14px}

.btn{
padding:18px 50px;margin:10px;border:none;font-family:Orbitron;
letter-spacing:3px;cursor:pointer;transition:.3s;
}

.primary{background:linear-gradient(90deg,#22d3ee,#3b82f6);color:black;box-shadow:0 0 25px cyan}
.secondary{border:2px solid cyan;background:none;color:cyan}
.btn:hover{transform:scale(1.05)}

.module{
display:none;position:absolute;top:50%;left:50%;
transform:translate(-50%,-50%);
width:650px;padding:35px;border:1px solid cyan;
background:rgba(0,0,0,.9);backdrop-filter:blur(12px);
}

input,textarea{
width:100%;padding:14px;background:black;border:1px solid cyan;
color:white;margin-top:15px;font-family:Orbitron;
}

.result{margin-top:15px;padding:15px;border:1px solid cyan}

footer{
position:fixed;bottom:0;width:100%;padding:15px 50px;
display:flex;justify-content:space-between;font-size:10px;
border-top:1px solid #22d3ee44;background:rgba(0,0,0,.6);
}

.social i{margin:0 10px;color:#777}
.social i:hover{color:cyan}

.tab{
flex:1;padding:14px;background:#020617;border:1px solid #22d3ee55;
color:#888;font-family:Orbitron;cursor:pointer;letter-spacing:3px;
}

.tab.active{
background:#22d3ee22;color:#22d3ee;box-shadow:inset 0 0 15px cyan;
}

.full{width:100%;margin-top:20px}
</style>
</head>

<body>

<header>
<div class="logo">CYBERSAFE</div>

<nav>
<a onclick="back()">HOME</a>
<a onclick="openCrime()">REPORT</a>
<a onclick="openThreat()">PREDICT</a>
</nav>

<!-- ✅ ADMIN BUTTON ADDED -->
<button class="btn secondary" onclick="goAdmin()">ADMIN</button>

</header>

<div class="cursor" id="cursor"></div>
<div class="scanline"></div>

<div class="hero" id="home">
<div>
<h1>Your Cyber<br><span class="glow">Space</span></h1>
<p class="subtitle">AI powered cybercrime reporting & threat prediction</p>
<button class="btn primary" onclick="openCrime()">REPORT CRIME</button>
<button class="btn secondary" onclick="openThreat()">SCAN THREAT</button>
</div>
</div>

<!-- CRIME -->
<div class="module" id="crime">
<h2>Crime Reporting</h2>

<textarea id="crimeText" placeholder="Describe cyber incident..."></textarea>
<input type="file" id="crimeImage" accept="image/*">

<button type="button" class="btn primary full" onclick="submitCrime()">SUBMIT REPORT</button>

<div id="crimeResult" class="result"></div>
<button onclick="back()">Back</button>
</div>

<!-- THREAT -->
<div class="module" id="threat">

<div style="display:flex;margin-bottom:20px">
<button id="urlTab" class="tab active" onclick="selectURL()">URL_SCAN</button>
<button id="emailTab" class="tab" onclick="selectEmail()">EMAIL_SCAN</button>
</div>

<div id="urlPanel">
<input id="urlInput" placeholder="https://suspicious-site.com">
<button type="button" class="btn primary full" onclick="predictURL()">SCAN</button>
</div>

<div id="emailPanel" style="display:none">
<textarea id="emailText" placeholder="Paste email..."></textarea>
<button type="button" class="btn primary full" onclick="predictEmail()">SCAN</button>
</div>

<div id="threatResult" class="result"></div>
<button onclick="back()">Back</button>

</div>

<footer>
<div>© CYBERSAFE AI 2026</div>
<div class="social">
<i class="fab fa-github"></i>
<i class="fab fa-linkedin"></i>
<i class="fab fa-twitter"></i>
</div>
</footer>

<script>
const API="http://127.0.0.1:5000";

function openCrime(){home.style.display="none";crime.style.display="block";}
function openThreat(){home.style.display="none";threat.style.display="block";}
function back(){crime.style.display="none";threat.style.display="none";home.style.display="flex";}

function goAdmin(){
window.location.href="login.html";
}

function submitCrime(){
let text=crimeText.value;
let image=crimeImage.files[0];

if(image){
let fd=new FormData();
fd.append("image",image);
fetch(API+"/predict_image",{method:"POST",body:fd})
.then(r=>r.json()).then(d=>{
crimeResult.innerHTML=`Crime Type: ${d.predicted_crime}`;
saveCrime(d.predicted_crime,text);
});
}else{
fetch(API+"/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})})
.then(r=>r.json()).then(d=>{
crimeResult.innerHTML=`Crime Type: ${d.predicted_crime}`;
saveCrime(d.predicted_crime,text);
});
}
}

function saveCrime(type,text){

let users = [
"Rohit Kumar","Priya Sharma","Rahul Verma",
"Neha Patel","Arjun Mehta","Amit Singh",
"Pooja Joshi","Karan Malhotra"
];

let randomUser = users[Math.floor(Math.random()*users.length)];

let crimes = JSON.parse(localStorage.getItem("crimes") || "[]");

crimes.push({
user: randomUser,
type:type,
description:text || "Image Report",
time:new Date().toLocaleString()
});

localStorage.setItem("crimes",JSON.stringify(crimes));
}


function predictURL(){
fetch(API+"/predict_url",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:urlInput.value})})
.then(r=>r.json()).then(d=>threatResult.innerHTML=`Threat Level: ${d.threat_level}`);
}

function predictEmail(){
fetch(API+"/predict_email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:emailText.value})})
.then(r=>r.json()).then(d=>threatResult.innerHTML=`Threat Level: ${d.email_threat}`);
}

function selectURL(){urlPanel.style.display="block";emailPanel.style.display="none";urlTab.classList.add("active");emailTab.classList.remove("active")}
function selectEmail(){urlPanel.style.display="none";emailPanel.style.display="block";emailTab.classList.add("active");urlTab.classList.remove("active")}
</script>

</body>
</html>
